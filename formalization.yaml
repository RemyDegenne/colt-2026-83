        `hypercube01_lt_budget_of_isPAC` (Ω(d²/ε²) on the hypercubes), `mSet_lt_budget_of_isPAC`
        (Ω(m(d-m+1)/ε²) on m-sets) and `unitBall_le_budget_of_isPAC` (Ω(d²/ε²) on the unit ball).
      sorry_count: 1
