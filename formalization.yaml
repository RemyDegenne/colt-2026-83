# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "colt-2026-83"
  description: >-
    A Lean 4 / Mathlib formalization of "On the Power of Adaptivity for ε-Best Arm Identification
    in Linear Bandits" (Maiti, Xu, Jamieson, COLT 2026): the fixed-design upper bound
    O((d log(1/δ) + w(𝒳)²)/ε²) in terms of a Gaussian width term w(𝒳) of the action set, the
    matching lower bounds Ω(d log(1/δ)/ε²) for every algorithm and Ω(w(𝒳)²/ε²) for non-adaptive
    fixed designs, the properties of w(𝒳), the structured action sets on which adaptivity gives at
    most logarithmic gains, the ℓ₂-norm estimation procedure, and the action set on which
    adaptivity gives a polynomial improvement. The linear bandit model is built on the LML
    (Lean Machine Learning) algorithm–environment framework; the objects (fixed-budget algorithms
    with stopping and output rules, PAC guarantees, fixed designs, design matrices, Gaussian widths) are
    introduced in library generality, to be contributed to LML and Mathlib. The development is
    blueprint-driven and proceeds in two phases: phase 1 states the headline results (this file
    lists them; their statements are `sorry`-ed challenge statements for leanprover/comparator),
    phase 2 proves them.
  authors:
    - "Rémy Degenne"
  responsible_maintainers:
    - "Rémy Degenne"
  license: "Apache-2.0"
  # extra keys (tolerated by the schema), kept for convenience:
  repository: "https://github.com/RemyDegenne/colt-2026-83"
  blueprint: "https://remydegenne.github.io/colt-2026-83/blueprint/"

# This repository is the substantive formalization, not a packaging or comparison layer.
repository:
  role: "substantive-development"

sources:
  - title: "On the Power of Adaptivity for ε-Best Arm Identification in Linear Bandits"
    authors:
      - "Arnab Maiti"
      - "Yunbei Xu"
      - "Kevin Jamieson"
    id: "COLT 2026, paper 83"
    type: "conference-paper"
    location: "Theorems 1–3, 5–8, Proposition 4 and the lower bounds of Table 1; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The LaTeX source of the paper is vendored in this repository under `source/`. The
      formalization is driven by a blueprint (`blueprint/src/`, written by Claude with the
      formalizer's review) that decomposes the paper's proofs into small lemmas and fills the
      steps the paper leaves to references; the blueprint is a derived artifact of this project,
      not an independent source. The formalizer is not an author of the paper.

related_formalizations: []   # no earlier or parallel formalization of this paper is known

# Pure exploration / best-arm identification in linear bandits, minimax sample complexity,
# Gaussian widths, optimal experimental design.
classification:
  arxiv: ["cs.LG", "stat.ML", "math.ST"]
  msc2020:
    - "62L05"   # sequential statistical design
    - "62K05"   # optimal statistical designs
    - "68T05"   # learning and adaptive systems
    - "60G15"   # Gaussian processes

status:
  scope: >-
    Phase 1 (statements). The headline results of the paper are stated in Lean, each as a
    `sorry`-ed theorem, over definitions written in library generality:

    Theorem 1 (`exists_isFixedDesign_isPAC`, blueprint `cor:upper_exists`/`thm:upper`): existence
    of a fixed-design (ε,δ)-PAC algorithm with budget ≤ 600 (w(𝒳)² + d log(2/δ))/ε² + 1.
    Theorem 2 (`le_budget_of_isPAC`, `thm:lower_adaptive`): every (ε,δ)-PAC algorithm, adaptive or
    not, has budget ≥ d log(1/δ)/(20000 ε²) when δ < 1/16.
    Theorem 3 (`le_budget_of_isFixedDesign_of_isPAC`, `thm:lower_nonadaptive`): every fixed-design
    (ε,δ)-PAC algorithm has budget ≥ w(𝒳)²/(70 ε²) when δ ≤ 1/10.
    Proposition 4 (`gw_le_card`, `gw_le_sqrt_log_ncard`, `sqrt_log_le_gw`): w(𝒳) ≤ d,
    w(𝒳) ≤ √(2 d log |𝒳|) for finite 𝒳, and w(𝒳) ≥ (1/8) √(d log ⌊d/2⌋) for d ≥ 4.
    Theorem 5 (`width_separation`, `thm:width_separation`): a finite multi-task set of intrinsic
    dimension r ∈ [d/2, d] with intrinsic width ≤ 3 √(d log d) while √(d log |𝒳|) ≥ 0.49 d^{3/4}.
    Theorem 6 (`exists_isPAC_of_finite`, `cor:log_gains_exists`/`thm:log_gains`): on every finite
    spanning set there is an adaptive (ε,δ)-PAC algorithm with budget
    ≤ 97281 d (log((|𝒳|/d)₊) + log(4/δ))/ε².
    Table 1 adaptive lower bounds (`multitaskSet_lt_budget_of_isPAC`,
    `hypercubePM_lt_budget_of_isPAC`, `hypercube01_lt_budget_of_isPAC`, `mSet_lt_budget_of_isPAC`,
    `unitBall_le_budget_of_isPAC`): Ω((∑ⱼ √dⱼ)²/ε²), Ω(d²/ε²) (two hypercubes and the unit ball)
    and Ω(md/ε²) for m-sets, for every (ε,δ)-PAC algorithm with δ below an absolute constant.
    Theorem 7 (`blockBallSet_le_budget_of_isFixedDesign_of_isPAC`, `blockBallSet_le_budget_of_isPAC`,
    `exists_isPAC_blockBallSet`; `thm:separation_lower_nonadaptive`, `cor:separation_exists`):
    on the block-ball set of ℝ^{kd}, non-adaptive algorithms need
    Ω(kd log(1/δ)/ε² + kd²/ε²) samples while an adaptive one uses O((kd log(8k/δ) + d²)/ε²).
    Theorem 8 (`exists_isAccurateNormEst`, `cor:norm_estimation_exists`/`thm:norm_estimation`):
    an (ε,δ)-accurate ℓ₂-norm estimation algorithm on the unit ball with budget
    ≤ 10⁵ d log(4/δ)/ε².

    The upper bounds (Theorems 1, 6, 7, 8) are stated in the paper's existential form ("there
    exists an algorithm with budget ≤ …"); the blueprint additionally states them for the explicit
    algorithms of the paper, whose definitions (rounding, G-optimal designs, Median Elimination,
    the norm-estimation meta-algorithm) belong to phase 2 together with the proofs.

    Phase 2 (proofs) has started with the Gaussian-width area: the support function and the
    Gaussian width of a set for a measure (`COLT83/Mathlib/Analysis/InnerProductSpace/SupportFn.lean`
    and `COLT83/Mathlib/Probability/GaussianWidth.lean`: Lipschitz,
    convexity, images, Minkowski sums, integrability, comparison by convolution/covariance
    domination), transport lemmas and norm moments of `multivariateGaussian`
    (`COLT83/Mathlib/Probability/MultivariateGaussian.lean`), Loewner antitonicity of the matrix
    inverse (`COLT83/Mathlib/Matrix/LoewnerInv.lean`), and the width-for-a-matrix and design-set
    lemmas of the model chapter (`COLT83/MXJ2026/{Width,DesignSet,WidthDesign}.lean`:
    `lem:width_matrix_wd`, `lem:width_homog`, `lem:width_mono`, `lem:width_iso`,
    `lem:width_symm`, `lem:width_empirical`, `lem:designset_basic`, `lem:exists_posdef_design`,
    `lem:gauss_comparison`), all proved.

    Second phase-2 area: optimal experimental design (`COLT83/MXJ2026/OptimalDesign.lean`, with
    `COLT83/Mathlib/Matrix/Loewner.lean` and `COLT83/Mathlib/Analysis/Calculus/LocalExtr.lean`):
    design distributions as finitely supported weights (`IsDesign`, `designMatrix`),
    Carathéodory for design matrices, the `G`-value and the identity `∑ λ_x xᵀA(λ)⁻¹x = d`,
    existence and positivity of `D`-optimal designs, and the Kiefer–Wolfowitz theorem
    (`exists_isGOptimalDesign`: a `G`-optimal design with `xᵀA⁻¹x ≤ d` on `𝒳` and `= d` on the
    support) with its normalized form used by the lower bounds; on the library side, the Loewner
    order versus quadratic forms and congruence, the scalar form of the antitonicity of the
    inverse, square-root identities and the matrix determinant lemma in rank-one form. The
    log-det derivative of the blueprint outline was replaced by this rank-one determinant
    formula (`lem:det_rank_one_mix`). Third area: the rounding theorem
    (`COLT83/MXJ2026/Rounding.lean`, `exists_rounding`): for `T ≥ 4d`, every design distribution
    with positive definite design matrix `A` can be rounded to `T` points of its support with
    `∑ x xᵀ ⪰ (T/4) A`, by the one-sided barrier argument of Batson–Spielman–Srivastava (barrier
    potential `tr (B - l I)⁻¹`, Sherman–Morrison, an averaging inequality on eigenvalues), with the
    consequences on the inverse and on the width of the rounded design; on the library side,
    traces and inverses of functions of a symmetric matrix through the continuous functional
    calculus (`COLT83/Mathlib/Matrix/HermitianCFC.lean`) and the Sherman–Morrison formula.
    Fourth area: the information-theoretic prerequisites
    (`COLT83/Mathlib/InformationTheory/{KLCompProd,Pinsker,BretagnolleHuber}.lean`,
    `COLT83/Mathlib/Probability/KLGaussian.lean`,
    `COLT83/LeanMachineLearning/{DivergenceDecomposition,FixedBudget}.lean`): the integrated
    chain rule `klDiv (μ ⊗ₘ κ) (ν ⊗ₘ η) = klDiv μ ν + ∫⁻ klDiv (κ a) (η a) ∂μ` (with the
    measurability of `a ↦ klDiv (κ a) (η a)`), the divergence of two Gaussians, Pinsker's and
    the Bretagnolle–Huber inequalities, the divergence decomposition for an algorithm run against
    two stationary environments (`IsAlgEnvSeq.klDiv_map_history`) with its linear Gaussian form,
    and the data-processing step for the outputs of fixed-budget runs (the stopping time of a
    fixed-budget algorithm is constant; the divergence of the output laws is bounded by
    `T R² ‖θ - θ'‖² / 2`, and Bretagnolle–Huber bounds the sum of the error probabilities of any
    test on the output). The output kernels of an identification algorithm are now required to
    be s-finite (`IdentAlg.isSFiniteKernel_output`). Fifth area: existence and transport of runs
    (`COLT83/LeanMachineLearning/Run.lean`: the canonical run of a fixed-budget algorithm on the
    space of (trajectory, output) pairs, `IsFixedBudget.isRun_fixedBudgetRunMeasure`; runs
    transported along maps of the sample space), the geometry of the normalized `G`-optimal
    design (`COLT83/MXJ2026/NormalizedDesign.lean`: `∑ λ_x ⟪v₁, v_x⟫² = 1/d` and a
    well-separated pair of unit arms), convexity of the divergence in its second argument
    (`COLT83/Mathlib/InformationTheory/KLMixture.lean`), and the **baseline adaptive lower bound**
    `T ≥ (2 - √2)/(32 ε²) log(1/(4δ))` for `(ε, δ)`-PAC fixed-budget algorithms on spanning sets in
    dimension `d ≥ 2`, `δ < 1/4` (`COLT83/MXJ2026/LowerAdaptiveBaseline.lean`,
    `baseline_le_budget_of_isPAC`, blueprint `lem:baseline_lower`) — the two-point half of
    Theorem 2, proved in the original coordinates (no transformation of the algorithm). Because runs
    can only be constructed in the universe of the action set, `LinearBandit.IsPAC` now quantifies
    over probability spaces in the universe of the ambient space `E` (it was universe-polymorphic);
    the comparator challenges were regenerated accordingly. Sixth area: the noise of linear
    Gaussian runs (`COLT83/LeanMachineLearning/GaussianNoise.lean`): conditionally on the history
    and the current action, `Y_t - ⟪X_t, θ⟫` has the law `N(0,1)` (the blueprint's noise
    representation), hence is conditionally sub-Gaussian, and Mathlib's Azuma–Hoeffding inequality
    bounds the noise sums of any block of rounds (`IsAlgEnvSeq.measureReal_abs_sum_noise_ge_le`),
    which is the concentration input of the estimation phase of Theorem 2's mixture test.
    Seventh area: **Theorem 2 is proved** (`le_budget_of_isPAC`, no `sorry`). The missing pieces
    were the composed test and its analysis: algorithms agreeing on a prefix and the transfer of a
    PAC guarantee to a partial run (`COLT83/LeanMachineLearning/AlgorithmPrefix.lean`), the
    algorithm `Algorithm.thenRepeat` "play `alg`, then repeat an action drawn from a kernel" and
    the test algorithm `IdentAlg.testAlg` built from an identification algorithm
    (`RepeatTest.lean`), the error bounds of the test in a linear Gaussian bandit via the
    Azuma bound of the sixth area (`RepeatTestGaussian.lean`), and the mixture testing problem
    (`COLT83/MXJ2026/MixtureKL.lean`: the divergence from the null law of histories to the
    design-weighted mixture of the alternatives is at most `(N+1)·9ε²/(2d)`, and the
    Bretagnolle–Huber inequality for this mixture). The blueprint's general sequential
    composition lemma (`lem:composition`) is not formalized; the new `lem:prefix_transfer` is
    the special case that is needed. Eighth area (towards Theorem 1): fixed-design runs and least
    squares. A sequence whose conditional law given its past is constant is i.i.d.
    (`COLT83/Mathlib/Probability/IidOfCondDistrib.lean`), hence the noise of any linear Gaussian
    run is an i.i.d. `N(0,1)` vector (standard Gaussian on `EuclideanSpace ℝ (Fin T)`), and under
    a fixed design the observation vector is `Xθ` plus this noise
    (`COLT83/LeanMachineLearning/FixedDesignRun.lean`, blueprint `lem:fixed_design_law`); the
    least-squares estimator `Σ⁻¹ Xᵀ y` has the law `N(θ, Σ⁻¹)`
    (`COLT83/MXJ2026/LeastSquares.lean`, `lem:least_squares_law`). Also the mixed design
    `½ λ₁ + ½ λ_G` with its `G`-optimality and width bounds (`MixedDesign.lean`), the regret
    bound by the difference process (`DifferenceProcess.lean`) and a measurable
    `γ`-approximate argmax selector on a compact set
    (`COLT83/Mathlib/MeasureTheory/ApproxArgmax.lean`). What remains for Theorem 1 is the
    Borell–TIS inequality (Gaussian concentration chapter), the attainment of the width and
    the assembly of the algorithm. Ninth area: **Gaussian concentration** (blueprint chapter
    `prereq_concentration`, previously entirely unformalized; Mathlib has no Gaussian
    concentration inequality). `COLT83/Mathlib/Probability/GaussianMGF.lean` (MGF of a linear
    form under the standard Gaussian, exponential moments of Gaussian norms from Fernique),
    `MaureyPisier.lean` (the Maurey–Pisier argument: a `C¹` function with `‖∇f‖ ≤ L` has a
    sub-Gaussian MGF with constant `c_G L²`, `c_G = π²/4`, via quarter-circle interpolation,
    Jensen, Fubini and Mathlib's rotation invariance of `μ ⊗ μ`),
    `COLT83/Mathlib/Analysis/{SpecialFunctions,InnerProductSpace}/LogSumExp.lean` (the
    log-sum-exp function and softmax weights on `ι → ℝ`, and the log-sum-exp smoothing of a
    finite maximum of linear forms as their composition with `v ↦ (⟪x i, v⟫)ᵢ`, its gradient), `SupportFnDense.lean` (the support function of a compact set as a supremum over
    a dense sequence, with monotone partial maxima) and `BorellTIS.lean` (concentration of
    finite and compact suprema of Gaussian linear forms, the **Borell–TIS inequality** for the
    standard Gaussian and for `N(0, S)`). Tenth area: **Theorem 1 is proved**
    (`exists_isFixedDesign_isPAC`, no `sorry`): the difference process and its concentration
    (`COLT83/MXJ2026/DifferenceProcess.lean`), the output law of fixed-budget runs
    (`IsRun.hasCondDistrib_output_finHistory`), the explicit fixed-design algorithm
    `fixedDesignIdentAlg T x s` (rounded design, least squares, measurable approximate argmax)
    with its guarantee `isPAC_fixedDesignIdentAlg` in the general form of the blueprint's
    `thm:upper` (`COLT83/MXJ2026/FixedDesignAlgorithm.lean`), and the assembly with the
    Kiefer–Wolfowitz design, an approximate width minimizer, the mixed design, the barrier
    rounding and the arithmetic of the constant 600 (`COLT83/MXJ2026/Upper.lean`).
    Eleventh area: **the Gaussian width chapter, upper bounds and Theorem 5**.
    `COLT83/Mathlib/Probability/SubgaussianMax.lean` (expected maximum of finitely many
    sub-Gaussian variables, `E[max_i Z_i] ≤ √(2 c log m)`, and the Gaussian width of a finite
    set), `COLT83/MXJ2026/WidthUpper.lean` (Proposition 4 (i)/(ii) for the `G`-optimal design
    matrix, the regionalized width and its bound `√(2 d log p)`),
    `COLT83/MXJ2026/IntrinsicWidth.lean` (a basis-free reduction: the intrinsic width of a
    non-spanning set is at most `E sup_{x ∈ 𝒳} ⟪x, G⟫` for a Gaussian vector `G` on the span
    whose covariance is the pseudo-inverse of a design matrix) and
    `COLT83/MXJ2026/Multitask.lean` (the multi-task set: one-hot parametrization, cardinality,
    support function as a sum of block maxima, span = vectors with equal block sums and its
    dimension `∑ d_j - m + 1`, the uniform design and its pseudo-inverse, and
    `intrinsicGw_multitaskSet_le : w_int(𝒳) ≤ ∑ √(2 d_j log d_j)`). **Theorem 5 is proved**
    (`width_separation`, no `sorry`), as are `gw_le_card` and `gw_le_sqrt_log_ncard`
    (Proposition 4 (i), (ii)). Twelfth area: **the Sudakov–Fernique chapter and Proposition 4
    (iii)**. `COLT83/Mathlib/Probability/SteinReal.lean` (Stein's identity
    `E[(ξ - μ) f(ξ)] = v E[f'(ξ)]` for `N(μ, v)`), `SteinIdentity.lean` (Stein's identity for
    the standard Gaussian measure of a finite-dimensional inner product space,
    `E[⟪a, g⟫ F(g)] = E[DF(g) a]`, for `N(0, S)`, `E[⟪a, X⟫ F(X)] = E[DF(X) (S a)]`, and for
    linear images, by Fubini along an orthonormal basis), `GaussianInterpolation.lean` (the
    interpolation `√t L₁ + √(1 - t) L₀` and the **Gaussian interpolation formula**: derivative
    of `E[F(Z_t)]` under the integral sign plus Stein), `SudakovFernique.lean` (the
    **Sudakov–Fernique inequality** `E[max_i X_i] ≤ E[max_i Y_i]` for centered Gaussian vectors
    with `E[(X_i - X_j)²] ≤ E[(Y_i - Y_j)²]`, via the soft-max and independent blocks on
    `ℝ^{ι ⊕ ι}`), `GaussianMaxLower.lean` (lower Mills ratio, `E[ξ⁺] = (2π)^{-1/2}`,
    `E[max(ξ₁, ξ₂)] = π^{-1/2}`, and `E[max_{i ≤ m} ξ_i] ≥ √(log m) / 4` for i.i.d. standard
    Gaussians, `m ≥ 2`), `COLT83/Mathlib/Analysis/{SpecialFunctions,InnerProductSpace}/LogSumExp.lean`
    (Hessian of the log-sum-exp and its operator-norm bound), `COLT83/Mathlib/Analysis/InnerProductSpace/IsotropicSeparated.lean`
    (a weighted family in isotropic position has `m` points pairwise `√(d + 1 - m)`-separated),
    and `COLT83/MXJ2026/WidthLower.lean` (the whitened design is isotropic; Sudakov minoration
    `gwMat 𝒳 A ≥ √(d log ⌊d/2⌋) / 8`). **Proposition 4 is now fully proved** (`sqrt_log_le_gw`,
    no `sorry`).

    Thirteenth area: **Theorem 3 is proved** (`le_budget_of_isFixedDesign_of_isPAC`, no `sorry`),
    by the Bayesian argument of the paper. New library files:
    `COLT83/Mathlib/Probability/StdGaussianProd.lean` (the product of two standard Gaussian
    measures is Gaussian; covariance of linear forms of an independent pair; **independence of
    uncorrelated linear images** `indepFun_add_prod_stdGaussian_of_comp_adjoint_eq_zero`),
    `COLT83/Mathlib/Probability/IndepIntegral.lean` (`E⟪f(V), W⟫ = 0` for `W` centered and
    independent of `V`, `f` bounded), `COLT83/Mathlib/Probability/Kernel/PriorAverage.lean`
    (the expected loss of a procedure that fails with probability `≤ δ` under every parameter is
    at most `ε + δ ∫ Z dπ`), and additions to `COLT83/Mathlib/Probability/CondDistrib.lean`
    (transport of `μ ⊗ₘ κ.comap f`). New project files:
    `COLT83/LeanMachineLearning/FixedDesignLaw.lean` (the explicit law
    `fixedDesignPairLaw A x θ` of (history, output) of a fixed-design fixed-budget run, and the
    PAC property on that law), `COLT83/MXJ2026/SingularDesign.lean` (a singular design leaves a
    direction invisible; two reward vectors with equal means whose regrets sum to `4 ε`) and
    `COLT83/MXJ2026/BayesModel.lean` (the Bayesian model on a standard Gaussian pair `(g, η)`:
    prior `θ = τ Σ_T^{-1/2} g`, observations, history and recommendation kernel; the orthogonal
    decomposition `θ = W + c Σ_T⁻¹ Xᵀ y` with `W` independent of `y`; the Bayes identity
    `E⟪rec, θ⟫ = c E⟪rec, Σ_T⁻¹ Xᵀ y⟫`; the lower bound `E[r] ≥ τ w_T - c (τ w_T + w_T)` and the
    PAC upper bound `E[r] ≤ ε + 2 τ δ w_T`).

    Fourteenth area: **four of the five adaptive lower bounds of Table 1 are proved**
    (`multitaskSet_lt_budget_of_isPAC`, `hypercubePM_lt_budget_of_isPAC`,
    `hypercube01_lt_budget_of_isPAC`, `mSet_lt_budget_of_isPAC`, no `sorry`; only the unit ball,
    which needs the Gaussian-prior chapter `prereq_bayes`, is left). The shared toolkit is
    `COLT83/LeanMachineLearning/TwoPoint.lean`: the divergence between the laws of the outputs of
    two runs of a fixed-budget algorithm is at most the expected sum of the squared gaps along the
    trajectory (`IsRun.klDiv_map_out_le_sum_integral`, data processing on top of the divergence
    decomposition), hence the **two-point inequality**
    `|P_θ(E) - P_θ'(E)| ≤ √(K/2)` for any bound `K` on that divergence
    (`IsRun.abs_measureReal_sub_le_of_sum_le`, with the uniform-bound special case
    `..._of_sq_le`), the **three-point inequality**
    `P_{θ⁺}(E) + P_{θ⁻}(Eᶜ) ≥ 1 - 2√(TC/4)` (`IsRun.one_sub_le_measureReal_add_of_sq_le`) and the
    conversion of a PAC guarantee into an expected-regret bound
    `E[r] ≤ ε + (Z - ε) δ` (`integral_simpleRegret_le_of_measureReal_le`). On the combinatorial
    side, `Fintype.sum_sum_update` (summing over all values of one coordinate of a dependent
    product multiplies the sum by the cardinality of that coordinate, via an involution) and
    `Finset.sum_powersetCard_succ_sum_mem` (the pairs `(S, i)` with `|S| = k+1`, `i ∈ S`, are in
    bijection with the pairs `(B, i)` with `|B| = k`, `i ∉ B`). The two hypercubes are handled at
    once as vertex sets of a box with two values per coordinate
    (`COLT83/MXJ2026/CubeSet.lean`: support function of a box, simple regret as a Hamming
    distance; `LowerCube.lean`: `le_of_isPAC_cubeSet`, blueprint `def:cube_set`,
    `lem:lower_cube`); the multi-task instances and their lower bound are in
    `MultitaskInstances.lean` and `LowerMultitask.lean`, the `m`-set ones in `MSetInstances.lean`
    and `LowerMSet.lean`.

    Not yet formalized: the other headline proofs and the remaining prerequisites of Part II of
    the blueprint (sub-exponential variables, continuity/attainment of the width, Median
    Elimination, Gaussian posteriors).
