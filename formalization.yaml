# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "colt-2026-83"
  description: >-
    A Lean 4 / Mathlib formalization of "On the Power of Adaptivity for ε-Best Arm Identification
    in Linear Bandits" (Maiti, Xu, Jamieson, COLT 2026): the fixed-design upper bound
    O((d log(1/δ) + w(𝒳)²)/ε²) in terms of a Gaussian width term w(𝒳) of the action set, the
    matching lower bounds Ω(d log(1/δ)/ε²) for every algorithm and Ω(w(𝒳)²/ε²) for non-adaptive
    fixed designs, the properties of w(𝒳), the structured action sets on which adaptivity gives at
    most logarithmic gains, the ℓ₂-norm estimation procedure, and the action set on which
    adaptivity gives a polynomial improvement. The linear bandit model is built on the LML
    (Lean Machine Learning) algorithm–environment framework; the objects (fixed-budget algorithms
    with stopping and output rules, PAC guarantees, fixed designs, design matrices, Gaussian widths) are
    introduced in library generality, to be contributed to LML and Mathlib. The development is
    blueprint-driven and proceeds in two phases: phase 1 states the headline results (this file
    lists them; their statements are `sorry`-ed challenge statements for leanprover/comparator),
    phase 2 proves them.
  authors:
    - "Rémy Degenne"
  responsible_maintainers:
    - "Rémy Degenne"
  license: "Apache-2.0"
  # extra keys (tolerated by the schema), kept for convenience:
  repository: "https://github.com/RemyDegenne/colt-2026-83"
  blueprint: "https://remydegenne.github.io/colt-2026-83/blueprint/"

# This repository is the substantive formalization, not a packaging or comparison layer.
repository:
  role: "substantive-development"

sources:
  - title: "On the Power of Adaptivity for ε-Best Arm Identification in Linear Bandits"
    authors:
      - "Arnab Maiti"
      - "Yunbei Xu"
      - "Kevin Jamieson"
    id: "COLT 2026, paper 83"
    type: "conference-paper"
    location: "Theorems 1–3, 5–8, Proposition 4 and the lower bounds of Table 1; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The LaTeX source of the paper is vendored in this repository under `source/`. The
      formalization is driven by a blueprint (`blueprint/src/`, written by Claude with the
      formalizer's review) that decomposes the paper's proofs into small lemmas and fills the
      steps the paper leaves to references; the blueprint is a derived artifact of this project,
      not an independent source. The formalizer is not an author of the paper.

related_formalizations: []   # no earlier or parallel formalization of this paper is known

# Pure exploration / best-arm identification in linear bandits, minimax sample complexity,
# Gaussian widths, optimal experimental design.
classification:
  arxiv: ["cs.LG", "stat.ML", "math.ST"]
  msc2020:
    - "62L05"   # sequential statistical design
    - "62K05"   # optimal statistical designs
    - "68T05"   # learning and adaptive systems
    - "60G15"   # Gaussian processes

status:
  scope: >-
    Phase 1 (statements). The headline results of the paper are stated in Lean, each as a
    `sorry`-ed theorem, over definitions written in library generality:

    Theorem 1 (`exists_isFixedDesign_isPAC`, blueprint `cor:upper_exists`/`thm:upper`): existence
    of a fixed-design (ε,δ)-PAC algorithm with budget ≤ 600 (w(𝒳)² + d log(2/δ))/ε² + 1.
    Theorem 2 (`le_budget_of_isPAC`, `thm:lower_adaptive`): every (ε,δ)-PAC algorithm, adaptive or
    not, has budget ≥ d log(1/δ)/(20000 ε²) when δ < 1/16.
    Theorem 3 (`le_budget_of_isFixedDesign_of_isPAC`, `thm:lower_nonadaptive`): every fixed-design
    (ε,δ)-PAC algorithm has budget ≥ w(𝒳)²/(70 ε²) when δ ≤ 1/10.
    Proposition 4 (`gw_le_card`, `gw_le_sqrt_log_ncard`, `sqrt_log_le_gw`): w(𝒳) ≤ d,
    w(𝒳) ≤ √(2 d log |𝒳|) for finite 𝒳, and w(𝒳) ≥ (1/8) √(d log ⌊d/2⌋) for d ≥ 4.
    Theorem 5 (`width_separation`, `thm:width_separation`): a finite multi-task set of intrinsic
    dimension r ∈ [d/2, d] with intrinsic width ≤ 3 √(d log d) while √(d log |𝒳|) ≥ 0.49 d^{3/4}.
    Theorem 6 (`exists_isPAC_of_finite`, `cor:log_gains_exists`/`thm:log_gains`): on every finite
    spanning set there is an adaptive (ε,δ)-PAC algorithm with budget
    ≤ 97281 d (log((|𝒳|/d)₊) + log(4/δ))/ε².
    Table 1 adaptive lower bounds (`multitaskSet_lt_budget_of_isPAC`,
    `hypercubePM_lt_budget_of_isPAC`, `hypercube01_lt_budget_of_isPAC`, `mSet_lt_budget_of_isPAC`,
    `unitBall_le_budget_of_isPAC`): Ω((∑ⱼ √dⱼ)²/ε²), Ω(d²/ε²) (two hypercubes and the unit ball)
    and Ω(md/ε²) for m-sets, for every (ε,δ)-PAC algorithm with δ below an absolute constant.
    Theorem 7 (`blockBallSet_le_budget_of_isFixedDesign_of_isPAC`, `blockBallSet_le_budget_of_isPAC`,
    `exists_isPAC_blockBallSet`; `thm:separation_lower_nonadaptive`, `cor:separation_exists`):
    on the block-ball set of ℝ^{kd}, non-adaptive algorithms need
    Ω(kd log(1/δ)/ε² + kd²/ε²) samples while an adaptive one uses O((kd log(8k/δ) + d²)/ε²).
    Theorem 8 (`exists_isAccurateNormEst`, `cor:norm_estimation_exists`/`thm:norm_estimation`):
    an (ε,δ)-accurate ℓ₂-norm estimation algorithm on the unit ball with budget
    ≤ 10⁵ d log(4/δ)/ε².

    The upper bounds (Theorems 1, 6, 7, 8) are stated in the paper's existential form ("there
    exists an algorithm with budget ≤ …"); the blueprint additionally states them for the explicit
    algorithms of the paper, whose definitions (rounding, G-optimal designs, Median Elimination,
    the norm-estimation meta-algorithm) belong to phase 2 together with the proofs.

    Not yet formalized (phase 2): all proofs, the explicit algorithms, and the prerequisites of
    Part II of the blueprint (Gaussian concentration, sub-exponential variables, divergence
    decomposition, Kiefer–Wolfowitz, rounding, Median Elimination, Gaussian posteriors).
  # Every headline statement below is currently `sorry`: phase 1 states, phase 2 proves.
  sorry_count: 17
  sorry_in_definitions: 0
  axioms: []               # to be filled when the proofs are in (phase 2)
  size:
    lean_lines: 841        # COLT83/ and COLT83.lean, phase 1
    theorems_and_lemmas: 17
    definitions: 30
    blueprint_tagged_declarations: 36  # blueprint/lean_decls, autogenerated
  main_results:
    - declaration: "COLT83.exists_isFixedDesign_isPAC"
      file: "COLT83/MXJ2026/Upper.lean"
      source_statement: "Theorem 1 — fixed-design upper bound O((d log(1/δ) + w(𝒳)²)/ε²)"
      note: >-
        Existential form of the paper's statement, with the explicit constant 600 of the blueprint
        (the paper's 360 is replaced because the rounding is done by a barrier argument); the
        blueprint's `thm:upper` is the same guarantee for an explicit algorithm.
      sorry_count: 1
      axioms: []
      comparator_config: "comparator/exists_isFixedDesign_isPAC.json"
      literature_dependencies: []
    - declaration: "COLT83.le_budget_of_isPAC"
      file: "COLT83/MXJ2026/LowerAdaptive.lean"
      source_statement: "Theorem 2 — lower bound Ω(d log(1/δ)/ε²) for every (adaptive) algorithm"
      note: "Explicit constant 1/20000 (the blueprint proof gives 1/(11556 + 5760√2)); δ < 1/16, d ≥ 2."
      sorry_count: 1
      axioms: []
      comparator_config: "comparator/le_budget_of_isPAC.json"
      literature_dependencies: []
    - declaration: "COLT83.le_budget_of_isFixedDesign_of_isPAC"
      file: "COLT83/MXJ2026/LowerNonadaptive.lean"
      source_statement: "Theorem 3 — lower bound Ω(w(𝒳)²/ε²) for non-adaptive fixed designs"
      note: >-
        Explicit constant 1/70, for δ ≤ 1/10 and budget T ≥ 1. Non-adaptive means a deterministic
        fixed design with an arbitrary (possibly randomized) recommendation kernel.
      sorry_count: 1
      axioms: []
      comparator_config: "comparator/le_budget_of_isFixedDesign_of_isPAC.json"
      literature_dependencies: []
    - declaration: "COLT83.gw_le_card"
      file: "COLT83/MXJ2026/WidthBounds.lean"
      source_statement: "Proposition 4 — w(𝒳) ≤ O(d)"
      note: "Companions in the same file: `gw_le_sqrt_log_ncard` (w(𝒳) ≤ √(2 d log |𝒳|)) and `sqrt_log_le_gw` (w(𝒳) ≥ (1/8)√(d log ⌊d/2⌋))."
      sorry_count: 1
      axioms: []
      comparator_config: "comparator/gw_le_card.json"
      literature_dependencies: []
    - declaration: "COLT83.width_separation"
      file: "COLT83/MXJ2026/WidthBounds.lean"
      source_statement: "Theorem 5 — a finite set with w(𝒳) ≤ O(√(d log d)) and √(d log |𝒳|) ≥ Ω(d^{3/4})"
      note: >-
        The set is a multi-task set that does not span ℝ^d; the statement is about its intrinsic
        width (width inside its span, of dimension r ∈ [d/2, d]), with explicit constants.
      sorry_count: 1
