automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code in a local checkout, driving `lake build` and the blueprint toolchain
        (`leanblueprint pdf/web/checkdecls`) directly. Project-level memory files record
        conventions across sessions.
      cost:
        wall_time: "started 2026-08-25"
        spend_usd: "subscription-based usage"
        hardware: "API-only (developer laptop)"
      prompting_notes: >-
        Blueprint-driven. The blueprint (a detailed proof document filling the gaps the paper
        leaves to references, with objects in library generality) was written first by the agent
        from an outline, reviewed, and then the formalization proceeds in two phases: statements of
        the headline results (phase 1), then proofs (phase 2), keeping the `\lean{}`/`\leanok` tags
        of the blueprint in sync with the Lean source.
  spend_usd: "subscription-based usage"
  notes: >-
    All Lean and blueprint LaTeX in this repository is produced with Claude Code under human
    direction and review.

fidelity:
  divergences: >-
    Statement-level choices (phase 1):

    1. Model. The action set is a nonempty compact subset 𝒳 of a Euclidean space
    `EuclideanSpace ℝ ι` (d = card ι); the paper's standing spanning assumption
    `span 𝒳 = ℝ^d` is an explicit hypothesis of the results that need it, so that the
    non-spanning structured sets (multi-task sets) are covered. An identification algorithm
    (`Learning.IdentAlg`) is an LML `Learning.Algorithm 𝒳 ℝ` (a sequence of policy kernels) with
    a measurable *stopping rule* on finite histories and an *output kernel* from histories to
    recommendations; the number of rounds played is the hitting time (`hittingAfter`) of the
    stopping rule by the process of histories. A run of the algorithm on a probability space is
    an LML algorithm-environment sequence (`Learning.IsAlgEnvSeq`) together with an output whose
    conditional law given the history at the stopping time is the output rule
    (`IdentAlg.IsRun`); PAC quantifies over all runs on all probability spaces. The paper's
    algorithms have a fixed budget T (stopping rule "stop after exactly T rounds",
    `IdentAlg.IsFixedBudget`); the definition also covers fixed-confidence algorithms. Time is
    0-indexed.

    2. Non-adaptive algorithms are deterministic fixed designs with an arbitrary, possibly
    randomized, recommendation kernel (the class of the paper's Theorem 3); the paper's Theorem 7
    says "possibly randomized non-adaptive", and its lower bound is stated here for this class.

    3. Gaussian width. The width of K for a positive definite matrix A, E[sup_{x∈K} ⟪x, A^{-1/2} g⟫],
    is defined as the Gaussian width of K for the centered Gaussian measure with covariance A⁻¹
    (the law of A^{-1/2} g), avoiding matrix square roots in the definition. The width term w(𝒳)
    is the infimum over positive definite design matrices, as in the paper.

    4. Constants. All O(·)/Ω(·) of the paper are replaced by explicit constants, which differ from
    the paper's where the blueprint uses a different route (Theorem 1: 600 instead of 360; the
    Table 1 bound for {0,1}^d has constant 1/400).

    5. The upper bounds (Theorems 1, 6, 7, 8) are stated in the paper's existential form. The
    blueprint proves them for explicit algorithms (Definitions `def:fixed_design_algorithm`,
    `def:region_algorithm`, `def:block_algorithm`, `def:meta_algorithm`), from which the
    existential statements follow.

review:
  status: "in-progress"
  reviewers:
    - "Rémy Degenne"
  notes: >-
    Phase 1: the statements were written against the blueprint and the paper. Phase 2 (in
    progress): Theorems 1, 2, 3 and 5, Proposition 4 and the multi-task, hypercube and m-set
    lower bounds of Table 1 are proved; the other headline statements are still `sorry`.
    Each headline statement is to be verified with leanprover/comparator once proved: the
    `comparator/` challenge files restate the theorems with their definitional dependencies
    inlined over a Mathlib-only import closure (configs listed as `comparator_config` above).
    The library layers (`COLT83/Mathlib/`, `COLT83/LeanMachineLearning/`) were reviewed for
    generality and placement: the Gaussian integrability lemmas hold on separable Banach spaces,
    the CFC and orthonormal-basis lemmas over `RCLike`; the remaining known restrictions are
    recorded as `## TODO` sections in the file docstrings.

alignment:
  namespace: "COLT83"
  note: >-
    The full source-to-Lean map is the blueprint: each theorem/lemma/definition environment in
    `blueprint/src/chapters/*.tex` carries a `\lean{}` tag naming the corresponding declaration.
    Library-level material lives under `COLT83/LeanMachineLearning/` (namespace `Learning`) and
    `COLT83/Mathlib/` (Mathlib namespaces); the paper's objects and results under
    `COLT83/MXJ2026/`. Only the headline statements are repeated here.
  statements:
    - source: "thm:upper / cor:upper_exists — Theorem 1, fixed-design upper bound"
      lean: "COLT83.exists_isFixedDesign_isPAC"
      module: "COLT83.MXJ2026.Upper"
      status: "proved"
      note: "Existential form; the explicit algorithm is `COLT83.fixedDesignIdentAlg`."
    - source: "thm:lower_adaptive — Theorem 2, adaptive lower bound"
      lean: "COLT83.le_budget_of_isPAC"
      module: "COLT83.MXJ2026.LowerAdaptive"
      status: "proved"
      note: "Proved with the constant 1/20000; the proof follows the blueprint chapter."

    - source: "thm:lower_nonadaptive — Theorem 3, non-adaptive lower bound"
      lean: "COLT83.le_budget_of_isFixedDesign_of_isPAC"
      module: "COLT83.MXJ2026.LowerNonadaptive"
      status: "proved"
      note: >-
        Bayesian proof: `COLT83/MXJ2026/BayesModel.lean` (prior, orthogonal decomposition, Bayes
        identity, regret bounds) and `COLT83/MXJ2026/SingularDesign.lean` (singular designs).
        `cor:lower_nonadaptive_H` (the paper's `H₂` form) is not formalized.
    - source: "prop:width_le_d, prop:width_finite, prop:width_lower_sqrt_dlogd — Proposition 4"
      lean: "COLT83.gw_le_card, COLT83.gw_le_sqrt_log_ncard, COLT83.sqrt_log_le_gw"
      module: "COLT83.MXJ2026.WidthBounds"
      status: "proved"
      note: "All three parts proved; (iii) via `prereq_sudakov` (Stein's identity, Gaussian interpolation, Sudakov–Fernique, expected maximum of i.i.d. Gaussians), all formalized." 
    - source: "thm:width_separation — Theorem 5"
