    Twenty-first area (2026-09-06): **Theorem 7's adaptive upper bound is proved**
    (`exists_isPAC_blockBallSet`, no `sorry`), which completes phase 2: every headline
    statement of the paper is now proved. The block algorithm (`BlockAlg.lean`) is a seeded
    algorithm with the seeds of the meta-algorithm: in phase 1 the rounds `[iN, (i+1)N)`
    run the norm estimator `NormEst(ε/4, δ/(2k))` embedded on block `i` (the next-action map
    applies the block embedding to the next-action map of the meta-algorithm evaluated on the
    projected history of the block); in phase 2 the basis vectors of the block `î`
    maximizing the estimates are played `n₂` times each and the normalized empirical mean
    vector is recommended. `BlockPlan.lean` proves by strong induction that the run on each
    block is the run of the meta-algorithm against `θ^(i)` on the shifted seed sequence
    (`seedStep_block`), that the phase-2 actions are the basis vectors of `î`
    (`seedAction_of_T₂_le`) and that the empirical mean vector is `θ^(î) + Δ` with `Δ` the
