name = "COLT83"
defaultTargets = ["COLT83"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "LeanMachineLearning"
git = "https://github.com/LeanMachineLearning/LML"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "LeanSpec"
git = "https://github.com/LeanMachineLearning/exposition"
rev = "main"
subDir = "LeanSpec"

[[lean_lib]]
name = "COLT83"

# Comparator (https://github.com/leanprover/comparator) challenge/solution modules for the
# headline results listed in formalization.yaml; see comparator/README.md. One library with a
# stub root: tools that import every library root (checkdecls, referee) must not load the
# challenge modules, which redeclare project and LML names, so those are globs, not roots.
[[lean_lib]]
name = "Comparator"
srcDir = "comparator"
leanOptions = { weak.linter.mathlibStandardSet = false }
globs = [
  "Comparator",
  "Solution",
  "Challenge_exists_isFixedDesign_isPAC",
  "Challenge_le_budget_of_isPAC",
  "Challenge_le_budget_of_isFixedDesign_of_isPAC",
  "Challenge_gw_le_card",
  "Challenge_gw_le_sqrt_log_ncard",
  "Challenge_sqrt_log_le_gw",
  "Challenge_width_separation",
  "Challenge_exists_isPAC_of_finite",
  "Challenge_multitaskSet_lt_budget_of_isPAC",
  "Challenge_hypercubePM_lt_budget_of_isPAC",
  "Challenge_hypercube01_lt_budget_of_isPAC",
  "Challenge_mSet_lt_budget_of_isPAC",
  "Challenge_unitBall_le_budget_of_isPAC",
  "Challenge_blockBallSet_le_budget_of_isFixedDesign_of_isPAC",
  "Challenge_blockBallSet_le_budget_of_isPAC",
  "Challenge_exists_isPAC_blockBallSet",
  "Challenge_exists_isAccurateNormEst",
]
